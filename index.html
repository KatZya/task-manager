<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Task Manager — a lightweight task planner with lists, priorities, deadlines, tags and local storage."
    />
    <meta name="theme-color" content="#63a1fd" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Task Manager</title>
    <script>
      ;(() => {
        try {
          const raw = localStorage.getItem('task-manager-app-v1')
          const saved = raw ? JSON.parse(raw) : null
          const theme =
            saved && (saved.theme === 'dark' || saved.theme === 'light')
              ? saved.theme
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = theme
        } catch {
          /* ignore broken storage — the app will fall back to defaults */
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Caveat:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
